<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Noto Sans Thai','Leelawadee UI',sans-serif;fill:#e9e6f5}
    .t{font-size:22px;font-weight:700}.d{font-size:15px;fill:#a9a4cc}.m{font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;letter-spacing:2px}
    .line{stroke:#e63946;stroke-width:2;stroke-dasharray:4 6;animation:mv 3s linear infinite}
    @keyframes mv{to{stroke-dashoffset:-40}}
    .p{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}
  </style>
  <rect x="1" y="1" width="898" height="228" rx="10" fill="#15122e" stroke="#2f2a55"/>
  <line x1="40" y1="62" x2="40" y2="168" class="line"/>
  <circle cx="40" cy="58" r="7" fill="#f6a65a"/>
  <text x="70" y="44" class="m" fill="#f6a65a" style="fill:#f6a65a">DONE</text>
  <text x="70" y="70" class="t">Wathasin</text>
  <text x="70" y="94" class="d">ฝึกพูดกับ AI ก่อนใช้จริง: practice pitches and interviews with an AI first</text>
  <text x="70" y="116" class="d">co-founder · won JUMP Thailand Hackathon 2026</text>
  <circle cx="40" cy="176" r="7" fill="none" stroke="#8f8ab8" stroke-width="2" class="p"/>
  <text x="70" y="166" class="m" style="fill:#8f8ab8">IN PROGRESS</text>
  <text x="70" y="192" class="t">something new</text>
  <text x="70" y="214" class="d">can't talk about it yet</text>
</svg>
