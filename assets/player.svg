  <g>
    <circle class="st" cx="700" cy="90" r="1.5"/><circle class="st" cx="760" cy="70" r="1.2"/>
    <circle class="st" cx="820" cy="110" r="1.6"/><circle class="st" cx="730" cy="150" r="1.1"/>
    <circle class="st" cx="850" cy="170" r="1.3"/><circle class="st" cx="790" cy="200" r="1.1"/>
  </g>
  <path d="M660 210 Q 760 160 860 70" fill="none" stroke="#e63946" stroke-width="1.5" stroke-dasharray="3 5" opacity=".7"/>
  <circle cx="860" cy="70" r="3" fill="#fff"/>
