  <text x="450" y="27" text-anchor="middle" class="k" font-size="13">~/owen</text>
  <line x1="1" y1="42" x2="899" y2="42" stroke="#2f2a55"/>
  <text x="28" y="76"><tspan class="c">$</tspan> whoami</text>
  <text x="28" y="102">owen  <tspan class="k">(thanawat thipkaew)</tspan></text>
  <text x="28" y="134"><tspan class="c">$</tspan> cat now.txt</text>
  <text x="28" y="160"><tspan class="k">studying</tspan>   computer engineering @ psu</text>
  <text x="28" y="184"><tspan class="k">into</tspan>       software, networks, ai agents</text>
