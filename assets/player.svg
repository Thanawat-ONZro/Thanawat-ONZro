<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <style>
    text{font-family:'JetBrains Mono',Consolas,Menlo,monospace;fill:#e9e6f5;font-size:15px}
    .k{fill:#8f8ab8}.c{fill:#f6a65a}
